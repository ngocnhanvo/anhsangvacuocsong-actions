name: Deploy Ánh Sáng và Cuộc Sống Astro Production

on:
  repository_dispatch:
    types: [wp_trigger_build]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anhsangvacuocsong-actions-deploy
  cancel-in-progress: false

jobs:
  web-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Resolve WC_URL from ENV_FILE
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          from urllib.parse import urlsplit
          values=[]
          for line in os.environ.get("ENV_FILE","").splitlines():
              line=line.strip()
              if line.startswith("export "): line=line[7:].strip()
              if line.startswith("WC_URL="):
                  val=line.partition("=")[2].strip()
                  if len(val)>1 and val[0]==val[-1] and val[0] in ("'",'"'): val=val[1:-1]
                  values.append(val)
          if len(values)!=1: raise SystemExit("Exactly one WC_URL required in ENV_FILE")
          url=urlsplit(values[0])
          host=(url.hostname or "").lower()
          if (url.scheme!="https" or not re.fullmatch(r"[a-z0-9.-]+",host)
                  or "." not in host or ".." in host or url.username or url.password
                  or url.port not in (None,443) or url.path not in ("","/")
                  or url.query or url.fragment): raise SystemExit("Invalid WC_URL")
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf8") as out:
              out.write("WC_URL=https://"+host+"\n")
          print("WordPress URL derived from ENV_FILE:",host)
          PY
      - name: Strictly verify destination identity
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          values = []
          for row in os.environ.get('ENV_FILE', '').splitlines():
              row = row.strip()
              if row.startswith('export '): row = row[7:].strip()
              if row.startswith('WC_URL_CLIENT='):
                  values.append(row.partition('=')[2].strip().strip('"').strip("'").rstrip('/'))
          if values != ['https://anhsangvacuocsong.vn']:
              raise SystemExit('REFUSED: wrong frontend domain for anhsangvacuocsong-actions')
          print('Target verified: https://anhsangvacuocsong.vn')
          PY

      - name: Checkout Actions Hub
        uses: actions/checkout@v4
        with:
          path: actions-hub

      - name: Validate required secrets
        shell: bash
        env:
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REPO_PAT"
          test -n "$ENV_FILE"
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"

      - name: Checkout private Ánh Sáng và Cuộc Sống Astro source
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/anhsangvacuocsong-astro
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source
          persist-credentials: false

      - name: Show production source revision
        working-directory: source
        run: echo "Deploying anhsangvacuocsong-astro@master $(git rev-parse HEAD)"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Make .env
        working-directory: source
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: printf '%s\n' "$ENV_FILE" > .env

      - name: Restore and update Astro cache
        uses: actions/cache@v4
        with:
          path: source/.cache
          key: ${{ runner.os }}-anhsangvacuocsong-dot-cache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-anhsangvacuocsong-dot-cache-

      - name: Seed target-only SEO files for compilation
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const fs=require("node:fs");fs.writeFileSync("public/sitemap.xml", `<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n<url><loc>https://anhsangvacuocsong.vn/</loc></url>\n</urlset>\n`);fs.writeFileSync("public/robots.txt", "User-agent: *\nAllow: /\nSitemap: https://anhsangvacuocsong.vn/sitemap.xml\n");'

      - name: Build Project
        working-directory: source
        run: pnpm run build-git

      - name: Regenerate final WordPress-owned SEO files after build
        working-directory: source
        shell: bash
        env:
          WC_URL_CLIENT: https://anhsangvacuocsong.vn
        run: |
          set -euo pipefail
          test -s scripts/sync-seo-files.mjs
          test -d dist/client
          pnpm sitemap
          cp public/sitemap.xml public/robots.txt dist/client/
          node --input-type=module -e 'import { syncSeoFiles } from "./scripts/sync-seo-files.mjs"; await syncSeoFiles({ distDir: "dist/client" });'
          test -s dist/client/sitemap.xml
          test -s dist/client/robots.txt
          grep -q 'https://anhsangvacuocsong.vn/' dist/client/sitemap.xml
          if grep -Eqi 'xuongmunonbaohiem|blue-sea|\.io\.vn/' dist/client/sitemap.xml dist/client/robots.txt; then
            echo '::error::SEO artifact contains old-project URLs.'
            exit 1
          fi

      - name: Verify compiled standalone server parses before FTP
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node --check dist/server/entry.mjs

      - name: Zip Build Folder
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy upload
          cp .env deploy/
          cp -r dist/* deploy/
          cd deploy
          zip -r ../upload/escvn.zip .
          cd ..
          rm -rf dist deploy

      - name: Prepare lftp without unnecessary apt index refresh
        shell: bash
        run: |
          set -euo pipefail
          started=$SECONDS
          if ! command -v lftp >/dev/null 2>&1; then
            # Ubuntu runners usually have usable apt indexes already.
            # Refresh only if direct installation fails.
            if ! sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends lftp; then
              echo "::warning::lftp install needed an apt index refresh; retrying."
              sudo apt-get update -y -qq
              sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends lftp
            fi
          fi
          lftp --version
          elapsed=$((SECONDS - started))
          echo "lftp setup completed in ${elapsed}s"
          echo "- lftp setup: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve Astro FTP target
        id: ftp_target
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_ASTRO_DIR: ${{ vars.FTP_ASTRO_DIR }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          url=$(printf '%s\n' "$ENV_FILE" | sed -n 's/^WC_URL_CLIENT=//p' | tail -1 | tr -d '\r\"\047')
          [[ "$url" =~ ^https?://([a-zA-Z0-9.-]+)(:[0-9]+)?/?$ ]] || { echo '::error::Invalid or missing WC_URL_CLIENT in ENV_FILE'; exit 1; }
          host="${BASH_REMATCH[1],,}"
          [[ "$host" == *.* && "$host" != *..* && "$host" =~ ^[a-z0-9.-]+$ ]] || exit 1
          default_dir="/domains/$host/public_html/"
          target="${FTP_ASTRO_DIR:-$default_dir}"
          [[ "$default_dir" == "/domains/anhsangvacuocsong.vn/public_html/" && "$target" == "$default_dir" ]] || { echo '::error::FTP target is not this project'; exit 1; }
          [[ "$target" =~ ^/[a-zA-Z0-9._/-]+/$ && "$target" != *..* && "$target" != *'//'* ]] || { echo '::error::Unsafe FTP target'; exit 1; }
          echo "Using FTP target: $target (frontend: $host)"
          if [[ "$target" != "$default_dir" ]]; then echo '::warning::Explicit FTP_ASTRO_DIR override in use'; fi
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 30
          set ftp:passive-mode yes
          set ssl:verify-certificate no
          cd "$target"
          pwd
          bye
          LFTP
          echo "path=$target" >> "$GITHUB_OUTPUT"
      - name: Verify signed WordPress unzip protocol before uploading
        shell: bash
        env:
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
          ASTRO_FTP_TARGET: ${{ steps.ftp_target.outputs.path }}
          FTP_ASTRO_DIR: ${{ vars.FTP_ASTRO_DIR }}
          ZIP_PATH: source/upload/escvn.zip
        run: |
          set -euo pipefail
          python3 -m py_compile actions-hub/scripts/esc-remote-unzip.py
          python3 actions-hub/scripts/esc-remote-unzip.py verify
      - name: Sync files via resumable FTP
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          ASTRO_FTP_TARGET: ${{ steps.ftp_target.outputs.path }}
          ZIP_PATH: source/upload/escvn.zip
        run: |
          set -euo pipefail
          bash actions-hub/scripts/esc-resumable-ftp.sh
      - name: Trigger signed remote unzip and validate Astro artifact
        shell: bash
        env:
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
          ASTRO_FTP_TARGET: ${{ steps.ftp_target.outputs.path }}
          FTP_ASTRO_DIR: ${{ vars.FTP_ASTRO_DIR }}
          ZIP_PATH: source/upload/escvn.zip
        run: |
          set -euo pipefail
          started=$SECONDS
          python3 actions-hub/scripts/esc-remote-unzip.py unpack
          elapsed=$((SECONDS - started))
          echo "Signed remote unzip completed in ${elapsed}s"
          echo "- Authenticated remote unzip: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"
